name: Test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@v2
        with:
          egress-policy: audit
      - uses: actions/checkout@v7
      - name: Run enable-auto-merge-error-handler tests
        run: bash scripts/enable-auto-merge-error-handler.test.sh
